<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - SynergySphere</title>
  <script src="https://www.gstatic.com/firebasejs/8.2.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.8/firebase-auth.js"></script>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body { 
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      line-height: 1.6;
    }
    
    .container {
      width: 100%;
      max-width: 420px;
      animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.8),
        0 20px 60px -12px rgba(0, 0, 0, 0.08),
        0 8px 25px -8px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
    }
    
    .logo { 
      text-align: center; 
      margin-bottom: 2rem; 
      opacity: 0;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
    }
    
    .logo svg { 
      width: 40px; 
      height: 40px; 
      filter: drop-shadow(0 2px 8px rgba(85, 129, 241, 0.2));
    }
    
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    
    h1 { 
      text-align: center; 
      font-size: 1.5rem; 
      font-weight: 600;
      color: #1e293b; 
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }
    
    .subtitle { 
      text-align: center; 
      color: #64748b; 
      font-size: 0.875rem; 
      margin-bottom: 2rem;
      font-weight: 400;
    }
    
    .form { 
      display: flex; 
      flex-direction: column; 
      gap: 1rem; 
    }
    
    .input-group {
      position: relative;
    }
    
    .input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 400;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.8);
      color: #1e293b;
      outline: none;
      min-height: 44px;
    }
    
    .input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
    
    .input:focus {
      border-color: #5581f1;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 0 0 4px rgba(85, 129, 241, 0.08),
        0 4px 12px -2px rgba(85, 129, 241, 0.15);
      transform: translateY(-1px);
    }
    
    .input:hover:not(:focus) {
      border-color: #cbd5e1;
      background: rgba(255, 255, 255, 0.9);
    }
    
    .button {
      background: linear-gradient(135deg, #5581f1 0%, #4c6ef5 100%);
      color: white;
      border: none;
      padding: 0.875rem 1rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
      min-height: 44px;
    }
    
    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }
    
    .button:hover {
      background: linear-gradient(135deg, #4c6ef5 0%, #4263eb 100%);
      transform: translateY(-2px);
      box-shadow: 
        0 8px 25px -6px rgba(85, 129, 241, 0.4),
        0 4px 12px -2px rgba(85, 129, 241, 0.2);
    }
    
    .button:hover::before {
      left: 100%;
    }
    
    .button:active {
      transform: translateY(-1px);
    }
    
    .link { 
      text-align: center; 
      margin-top: 2rem; 
      font-size: 0.875rem; 
      color: #64748b;
    }
    
    .link a { 
      color: #5581f1; 
      text-decoration: none; 
      font-weight: 500;
      transition: all 0.2s ease;
      position: relative;
    }
    
    .link a:hover { 
      color: #4c6ef5;
    }
    
    .link a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 1px;
      bottom: -2px;
      left: 0;
      background-color: #4c6ef5;
      transition: width 0.3s ease;
    }
    
    .link a:hover::after {
      width: 100%;
    }
    
    @media (max-width: 640px) {
      body {
        padding: 0.5rem;
      }
      
      .card {
        padding: 1.5rem 1.25rem;
        border-radius: 16px;
        margin: 0;
      }
      
      .logo {
        margin-bottom: 1.5rem;
      }
      
      .logo svg {
        width: 36px;
        height: 36px;
      }
      
      h1 {
        font-size: 1.375rem;
      }
      
      .subtitle {
        font-size: 0.8125rem;
        margin-bottom: 1.5rem;
      }
      
      .form {
        gap: 0.875rem;
      }
      
      .input {
        padding: 0.75rem 0.875rem;
        font-size: 1rem;
        border-radius: 8px;
      }
      
      .button {
        padding: 0.75rem 0.875rem;
        font-size: 1rem;
        border-radius: 8px;
        margin-top: 0.25rem;
      }
      
      .link {
        margin-top: 1.5rem;
        font-size: 0.8125rem;
      }
    }
    
    @media (max-width: 375px) {
      .card {
        padding: 1.25rem 1rem;
      }
      
      h1 {
        font-size: 1.25rem;
      }
      
      .input, .button {
        padding: 0.6875rem 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 110 177" fill="none">
          <path d="M9.08468 55L79.5847 1L45.0847 61.5L30.5847 73.5L30.0847 74.5L29.5847 76L30.0847 77.5L30.5847 78.5L60.0847 101.5L60.5847 103L60.0847 104.5L28.0847 172.5L38.5847 118.5L7.58468 93L4.58469 89.5L2.08468 85.5C2.08468 85.5 1.27897 82.4818 1.08468 80.5C0.894156 78.5567 1.08468 75.5 1.08468 75.5C1.08468 73.5 1.58469 70 1.58469 70L3.08468 65.5L5.58468 60.5L9.08468 55Z" fill="#5581F1"/>
          <path d="M50.5847 73.5L81.0847 5L71.0847 59.5L101.585 83L106.585 91.5L108.585 101.5L108.085 107L106.585 112.5L104.085 117.5L100.585 121.5L30.5847 176L65.0847 116.5L79.5847 104.5L80.0847 103.5L80.0847 102.5V101L79.5847 100L50.5847 77.5L50.0847 76.5V75.5V74.5L50.5847 73.5Z" fill="#5581F1"/>
        </svg>
      </div>
      <h1>Create account</h1>
      <p class="subtitle">Join SynergySphere today</p>
      <form class="form" id="signupForm">
        <div class="input-group">
          <input type="text" placeholder="Full Name" class="input" id="fullName" required>
        </div>
        <div class="input-group">
          <input type="email" placeholder="Email address" class="input" id="email" required>
        </div>
        <div class="input-group">
          <input type="tel" placeholder="Phone number" class="input" id="phone" required>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" class="input" id="password" required>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Confirm password" class="input" id="confirmPassword" required>
        </div>
        <button type="submit" class="button" id="signupBtn">Create Account</button>
      </form>
      <div class="link">
        Already have an account? <a href="../login/">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAB3K8OGCzAidT8yc8rrdn48z0oEAPkeJ4",
      authDomain: "fractal-crm.firebaseapp.com",
      projectId: "fractal-crm",
      storageBucket: "fractal-crm.firebasestorage.app",
      messagingSenderId: "553189715954",
      appId: "1:553189715954:web:c9f58c2b3eedebbfa6456b",
      measurementId: "G-D2Z62248GY"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Check if user is already signed in
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = '../onboard/';
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value
      };
      
      const signupBtn = document.getElementById('signupBtn');
      
      if (formData.password !== formData.confirmPassword) {
        alert('Passwords do not match!');
        return;
      }
      
      signupBtn.textContent = 'Creating Account...';
      signupBtn.disabled = true;
      
      try {
        // Step 1: Create Firebase account
        signupBtn.textContent = 'Creating Account...';
        const { user } = await auth.createUserWithEmailAndPassword(formData.email, formData.password);
        await user.updateProfile({ displayName: formData.fullName });
        
        // Delay after account creation
        await new Promise(resolve => setTimeout(resolve, 1000));

        // Step 2: Save data to API
        signupBtn.textContent = 'Saving Data...';
        const response = await fetch('https://3bwe7jozemvnnk7pwxcjyh3uqa0suoid.lambda-url.us-east-2.on.aws/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: user.uid,
            name: formData.fullName,
            phone: formData.phone,
            email: formData.email
          })
        });
        
        if (!response.ok) {
          console.log('Response status:', response.status);
          const responseText = await response.text();
          console.log('Response text:', responseText);
          throw new Error('Failed to save user data');
        }
        
        // Verify response contains success data
        const responseData = await response.json();
        console.log('Data saved successfully:', responseData);
        
        // Delay after confirming data is saved
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        // Step 3: Final verification
        signupBtn.textContent = 'Setup Complete!';
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Only redirect after confirming data is saved
        window.location.href = '../onboard/';
      } catch (error) {
        console.error('Error:', error);
        alert(error.message);
      } finally {
        signupBtn.textContent = 'Create Account';
        signupBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
