<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - SynergySphere</title>
  <script src="https://www.gstatic.com/firebasejs/8.2.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.8/firebase-auth.js"></script>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body { 
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      line-height: 1.6;
    }
    
    .container {
      width: 100%;
      max-width: 480px;
      animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 3rem 2rem;
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.8),
        0 20px 60px -12px rgba(0, 0, 0, 0.08),
        0 8px 25px -8px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    
    .logo { 
      margin-bottom: 2rem; 
    }
    
    .logo svg { 
      width: 64px; 
      height: 64px; 
      filter: drop-shadow(0 2px 8px rgba(85, 129, 241, 0.2));
    }
    
    h1 { 
      font-size: 2rem; 
      font-weight: 600;
      color: #1e293b; 
      margin-bottom: 1rem;
    }
    
    .subtitle { 
      color: #64748b; 
      font-size: 1rem; 
      margin-bottom: 2.5rem;
    }
    
    .form { 
      display: flex; 
      flex-direction: column; 
      gap: 1rem;
      text-align: left;
    }
    
    .input-group {
      position: relative;
    }
    
    .input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 400;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.8);
      color: #1e293b;
      outline: none;
      min-height: 44px;
    }
    
    .input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
    
    .input:focus {
      border-color: #5581f1;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 0 0 4px rgba(85, 129, 241, 0.08),
        0 4px 12px -2px rgba(85, 129, 241, 0.15);
      transform: translateY(-1px);
    }
    
    .input:hover:not(:focus) {
      border-color: #cbd5e1;
      background: rgba(255, 255, 255, 0.9);
    }
    
    .button {
      background: linear-gradient(135deg, #5581f1 0%, #4c6ef5 100%);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    
    .button:hover {
      background: linear-gradient(135deg, #4c6ef5 0%, #4263eb 100%);
      transform: translateY(-2px);
    }
    
    @media (max-width: 640px) {
      .card {
        padding: 2rem 1.5rem;
      }
      
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 110 177" fill="none">
          <path d="M9.08468 55L79.5847 1L45.0847 61.5L30.5847 73.5L30.0847 74.5L29.5847 76L30.0847 77.5L30.5847 78.5L60.0847 101.5L60.5847 103L60.0847 104.5L28.0847 172.5L38.5847 118.5L7.58468 93L4.58469 89.5L2.08468 85.5C2.08468 85.5 1.27897 82.4818 1.08468 80.5C0.894156 78.5567 1.08468 75.5 1.08468 75.5C1.08468 73.5 1.58469 70 1.58469 70L3.08468 65.5L5.58468 60.5L9.08468 55Z" fill="#5581F1"/>
          <path d="M50.5847 73.5L81.0847 5L71.0847 59.5L101.585 83L106.585 91.5L108.585 101.5L108.085 107L106.585 112.5L104.085 117.5L100.585 121.5L30.5847 176L65.0847 116.5L79.5847 104.5L80.0847 103.5L80.0847 102.5V101L79.5847 100L50.5847 77.5L50.0847 76.5V75.5V74.5L50.5847 73.5Z" fill="#5581F1"/>
        </svg>
      </div>
      <h1>Complete Your Setup</h1>
      <p class="subtitle">Tell us about your organization</p>
      
      <form class="form" id="onboardForm">
        <div class="input-group">
          <input type="text" placeholder="Company Name" class="input" id="companyName" required>
        </div>
        <div class="input-group">
          <input type="text" placeholder="Project Name" class="input" id="projectName" required>
        </div>
        <div class="input-group">
          <input type="text" placeholder="Team Name" class="input" id="teamName" required>
        </div>
        <button type="submit" class="button" id="completeBtn">Complete Setup</button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAB3K8OGCzAidT8yc8rrdn48z0oEAPkeJ4",
      authDomain: "fractal-crm.firebaseapp.com",
      projectId: "fractal-crm",
      storageBucket: "fractal-crm.firebasestorage.app",
      messagingSenderId: "553189715954",
      appId: "1:553189715954:web:c9f58c2b3eedebbfa6456b",
      measurementId: "G-D2Z62248GY"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Check if onboarding already exists
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const checkResponse = await fetch('https://3bwe7jozemvnnk7pwxcjyh3uqa0suoid.lambda-url.us-east-2.on.aws/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid: user.uid })
          });
          
          if (checkResponse.ok) {
            const checkData = await checkResponse.json();
            if (checkData.exists) {
              window.location.href = '/';
              return;
            }
          }
        } catch (error) {
          console.log('Check failed, proceeding with onboarding');
        }
      }
    });

    document.getElementById('onboardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const user = auth.currentUser;
      if (!user) {
        alert('Please sign in first');
        window.location.href = '../login/';
        return;
      }
      
      const formData = {
        uid: user.uid,
        companyName: [document.getElementById('companyName').value],
        projectName: [document.getElementById('projectName').value],
        teamName: [document.getElementById('teamName').value]
      };
      
      const completeBtn = document.getElementById('completeBtn');
      completeBtn.textContent = 'Completing Setup...';
      completeBtn.disabled = true;
      
      try {
        const response = await fetch('https://3bwe7jozemvnnk7pwxcjyh3uqa0suoid.lambda-url.us-east-2.on.aws/onboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        
        if (!response.ok) throw new Error('Failed to save onboarding data');
        
        const responseData = await response.json();
        console.log('Onboarding completed:', responseData);
        
        await new Promise(resolve => setTimeout(resolve, 1000));
        window.location.href = '/';
      } catch (error) {
        console.error('Error:', error);
        alert('Failed to complete setup. Please try again.');
      } finally {
        completeBtn.textContent = 'Complete Setup';
        completeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
