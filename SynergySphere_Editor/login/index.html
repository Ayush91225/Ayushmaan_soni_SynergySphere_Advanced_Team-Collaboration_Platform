<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — SynergySphere Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --panel: rgba(15,15,15,0.85);
            --text: #f8fafc;
            --muted: #666666;
            --accent: #0078d4;
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            min-width: 400px;
            box-shadow: 0 16px 64px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #0078d4, #6b46c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 32px;
            font-size: 16px;
        }

        .github-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px 24px;
            color: var(--text);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
        }

        .github-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .github-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .loading {
            display: none;
            color: var(--muted);
            margin-top: 16px;
        }

        .error {
            color: #ef4444;
            margin-top: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">SynergySphere</div>
        <div class="subtitle">GitHub-integrated code editor</div>
        
        <button class="github-btn" id="github-login">
            <svg class="github-icon" viewBox="0 0 24 24">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            Continue with GitHub
        </button>
        
        <div class="loading" id="loading">Authenticating...</div>
        <div class="error" id="error"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001';
        
        document.getElementById('github-login').addEventListener('click', async () => {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').textContent = '';
                
                const response = await fetch(`${API_BASE}/auth/github`);
                const { redirectUri } = await response.json();
                
                window.location.href = redirectUri;
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Authentication failed. Please try again.';
            }
        });

        // Handle OAuth callback
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            handleCallback(code);
        }

        async function handleCallback(code) {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').textContent = '';
                
                const response = await fetch(`${API_BASE}/auth/callback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                
                if (!response.ok) {
                    throw new Error('Authentication failed. Please try again.');
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (data.sessionId) {
                    localStorage.setItem('github-session', data.sessionId);
                    localStorage.setItem('github-user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    throw new Error('Invalid response from server');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = error.message;
                console.error('Auth error:', error);
            }
        }
    </script>
</body>
</html>
